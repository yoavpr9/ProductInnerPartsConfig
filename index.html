<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Config Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-column workbench — project/files/parts | 3D viewport | checks/inspector. Stacks to one column on phones. */
:root{
  --bg:#f3f4ef; --panel:#fbfcf8; --viewport:#e9ece4; --ink:#1b1c1a; --mute:#666b63; --line:#cfd3c8; --grid:#b7bcb1;
  --accent:#1c3f8f; --accent-ink:#ffffff; --warn:#a86a05; --crit:#c5432c; --ok:#2f7d4f; --chip:#e6e9df;
  --f-ui:"Heebo","Segoe UI",Arial,sans-serif; --f-head:"Space Grotesk","Heebo",Arial,sans-serif; --f-mono:"DM Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141613; --panel:#1c1f1b; --viewport:#232621; --ink:#eceee7; --mute:#9aa093; --line:#383c35; --grid:#4a4f46;
  --accent:#8fb0ff; --accent-ink:#0f1626; --warn:#e0a640; --crit:#f07a62; --ok:#6cc48d; --chip:#2a2e28; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141613; --panel:#1c1f1b; --viewport:#232621; --ink:#eceee7; --mute:#9aa093; --line:#383c35; --grid:#4a4f46;
  --accent:#8fb0ff; --accent-ink:#0f1626; --warn:#e0a640; --crit:#f07a62; --ok:#6cc48d; --chip:#2a2e28; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:12px;height:100%;min-height:560px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lab{font-family:var(--f-head);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:22px;margin:0;line-height:1.1}
.brand p{margin:0;color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.solid{background:var(--ink);color:var(--panel)}
.btn.solid:hover{opacity:.88}
.btn.small{padding:3px 9px;font-size:12px}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields .wide{grid-column:1/-1}
.infob{width:28px;height:28px;padding:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:15px;flex:none}
.help h3{font-family:var(--f-head);font-size:15px;margin:14px 0 4px}
.help h3:first-child{margin-top:0}
.help ul,.help ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.help li{max-width:70ch}
.help kbd{font-family:var(--f-mono);font-size:11.5px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 11px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.drop{border:1.5px dashed var(--mute);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;color:var(--mute);font-size:13px}
.drop b{color:var(--ink);display:block;font-size:14px}
.drop.over{border-color:var(--accent);background:var(--chip);color:var(--ink)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer;min-width:0}
.item:hover{background:var(--chip)}
.item.sel{border-color:var(--ink)}
.item.on .nm{color:var(--mute)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mono,.mono{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stat b,.big{direction:ltr;unicode-bidi:isolate;text-align:start}
[dir=rtl] .stat b,[dir=rtl] .big{text-align:right}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid var(--ink)}
.cat{font-size:11px;color:var(--mute);margin-top:6px;letter-spacing:.05em}
.center{display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.viewport{position:relative;flex:1;min-height:340px;background:var(--viewport);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-130%);background:var(--panel);border:1px solid var(--ink);border-radius:5px;padding:1px 6px;font-size:11px;white-space:nowrap}
.ptag{position:absolute;transform:translate(-50%,-150%);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px;font-size:11px;white-space:nowrap}
.mapview{flex:1;min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msys{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.msys h3{margin:0;font-family:var(--f-head);font-size:16px;display:flex;align-items:center;gap:7px}
.msys .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ksw{width:12px;height:12px;border-radius:3px;display:inline-block}
label.rootsel{margin-inline-start:auto;flex-direction:row;align-items:center;gap:6px}
.rootsel select{width:auto;max-width:240px}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-inline-start:22px;padding-inline-start:20px;border-inline-start:2px solid var(--mute)}
ul.tree li{position:relative;padding:2px 0}
ul.tree ul>li::before{content:"";position:absolute;inset-inline-start:-20px;top:15px;width:18px;border-top:2px solid var(--mute)}
.mnode{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mname{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip)}
.mname:hover,.mname:focus-visible{border-color:var(--accent)}
.mnode.sel .mname{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.medge{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.medge.ok{color:var(--ok)} .medge.bad,.medge.miss{color:var(--crit)}
.mdel{padding:0 6px;opacity:.55} .mnode:hover .mdel,.mdel:focus-visible{opacity:1}
.mextra{font-size:11.5px;color:var(--mute);margin-inline-start:22px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.mrow select{max-width:220px}
.ltag{position:absolute;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:var(--f-mono);font-size:10.5px;white-space:nowrap}
.ltag.bad{border-color:var(--crit);color:var(--crit)}
.viewport.picking canvas{cursor:crosshair}
.hint{position:absolute;bottom:8px;inset-inline-start:10px;font-size:11.5px;color:var(--mute);pointer-events:none;max-width:70%}
.axes{position:absolute;top:8px;inset-inline-start:10px;font-family:var(--f-mono);font-size:11px;color:var(--mute);pointer-events:none}
.chipname{position:absolute;top:8px;inset-inline-end:10px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.big{font-family:var(--f-head);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:13px;color:var(--mute);font-weight:500;margin-inline-start:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{display:block;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat.bad{border-color:var(--crit)} .stat.bad b{color:var(--crit)}
.stat.warn{border-color:var(--warn)} .stat.warn b{color:var(--warn)}
.issues button{all:unset;cursor:pointer;display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:3px 0;width:100%}
.issues button:hover{text-decoration:underline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--crit)}
.dot.w{background:var(--warn)} .dot.r{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12px}
.why{border-inline-start:3px solid var(--accent);padding-inline-start:8px;font-size:12.5px}
.fine{font-size:11.5px;color:var(--mute);margin:0}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11.5px;margin:1px}
.example{background:var(--warn);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:1180px;width:100%;max-height:92%;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.scroll{overflow:auto;min-height:0}
table.grid{border-collapse:collapse;font-size:12.5px;width:max-content;min-width:100%}
table.grid th{position:sticky;top:0;background:var(--panel);text-align:start;font-weight:600;font-size:11.5px;color:var(--mute);padding:4px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
table.grid td{padding:2px 3px;border-bottom:1px solid var(--line)}
table.grid input,table.grid select{border-color:transparent;background:transparent;padding:4px 5px}
table.grid input:hover,table.grid select:hover{border-color:var(--line)}
.w-s{width:64px}.w-m{width:110px}.w-l{width:170px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--panel);border-inline-start:1px solid var(--ink);z-index:60;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px}
.rule.onr{border-color:var(--accent)}
.rule h4{margin:0;font-size:13.5px;display:flex;gap:8px;align-items:center}
.rule p{margin:0;font-size:12px;color:var(--mute)}
.code{font-family:var(--f-mono);font-size:11px;background:var(--chip);border-radius:4px;padding:0 5px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:1020px){ html,body{height:auto} .app{grid-template-columns:1fr;height:auto} .col{overflow:visible} .viewport{min-height:420px} .center{order:-1} }
</style>

<div class="app" id="app">
  <aside class="col">
    <header class="brand">
      <div class="head"><span class="lab" data-t="tagline"></span>
        <span class="row" style="flex-wrap:nowrap"><span class="seg" id="segLang"><button type="button" data-v="he">עברית</button><button type="button" data-v="en">English</button></span><button type="button" class="btn infob" id="btnHelp" aria-label="Help" title="Help">i</button></span></div>
      <h1>Config Studio</h1>
      <span class="mono" id="verBrand"></span>
    </header>
    <section class="card">
      <div class="head"><span class="lab" data-t="project"></span><span class="example" id="exBadge" hidden data-t="example"></span></div>
      <select id="selProject" aria-label="project"></select>
      <label class="f"><span data-t="projName"></span><input type="text" id="projName" maxlength="60"></label>
      <div class="row">
        <button type="button" class="btn small solid" id="btnNewProj" data-t="newProj"></button>
        <button type="button" class="btn small" id="btnExportProj" data-t="exportProj"></button>
        <button type="button" class="btn small" id="btnImportProj" data-t="importProj"></button>
        <button type="button" class="btn small" id="btnExample" data-t="openExample"></button>
        <button type="button" class="btn small danger" id="btnDelProj" data-t="delProj"></button>
        <input type="file" id="projFile" accept=".json" hidden>
      </div>
      <details><summary class="fine" data-t="refTitle" style="cursor:pointer"></summary>
        <div class="fields" style="margin-top:8px">
          <label class="f wide"><span data-t="refLabel"></span><input type="text" id="refLabel" maxlength="40"></label>
          <label class="f"><span data-t="refX"></span><input type="number" id="refX" step="5"></label>
          <label class="f"><span data-t="refZ"></span><input type="number" id="refZ" step="5"></label>
          <label class="f wide"><span data-t="tol"></span><input type="number" id="tol" min="0" step="1"></label>
        </div>
        <p class="fine" data-t="refNote" style="margin-top:6px"></p>
      </details>
      <p class="fine" id="storage"></p>
    </section>
    <section class="card">
      <div class="head"><span class="lab" data-t="files"></span></div>
      <div class="drop" id="drop" tabindex="0" role="button"><b data-t="dropTitle"></b><span data-t="dropSub"></span></div>
      <input type="file" id="cadFile" accept=".stl,.obj,.step,.stp" multiple hidden>
      <ul class="plain" id="shells"></ul>
      <div class="head"><span class="lab" data-t="points"></span><button type="button" class="btn small" id="btnPoint" aria-pressed="false" data-t="addPoint"></button></div>
      <p class="fine" data-t="pointsNote"></p>
      <ul class="plain" id="points"></ul>
      <details id="shSet" hidden><summary class="fine" data-t="shSettings" style="cursor:pointer"></summary>
        <div class="fields" style="margin-top:8px">
          <label class="f wide"><span data-t="name"></span><input type="text" id="shName" maxlength="40"></label>
          <label class="f"><span data-t="units"></span><select id="shUnit"><option value="1">mm</option><option value="10">cm</option><option value="1000">m</option><option value="25.4">inch</option></select></label>
          <label class="f"><span data-t="upAxis"></span><select id="shUp"><option value="y">Y</option><option value="z">Z</option></select></label>
          <label class="f"><span data-t="turn"></span><select id="shTurn"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label>
          <label class="f"><span data-t="under"></span><input type="number" id="shUnder" step="5"></label>
          <label class="f wide"><span data-t="kind"></span><select id="shKind"><option value="hollow" data-t="kindHollow"></option><option value="solid" data-t="kindSolid"></option></select></label>
        </div>
        <p class="fine" id="shSize" style="margin-top:6px"></p>
        <div class="row"><button type="button" class="btn small danger" id="btnShDel" data-t="removeShell"></button></div>
      </details>
    </section>
    <section class="card" style="flex:1;min-height:180px">
      <div class="head"><span class="lab" data-t="parts"></span><span class="mono" id="trayCount"></span></div>
      <div class="row">
        <button type="button" class="btn small solid" id="btnTable" data-t="openTable"></button>
        <button type="button" class="btn small" id="btnBank" data-t="ruleBank"></button>
      </div>
      <div id="tray"></div>
    </section>
  </aside>

  <main class="center">
    <div class="bar">
      <span class="seg" id="segPage"><button type="button" data-v="3d" data-t="page3d"></button><button type="button" data-v="map" data-t="pageMap"></button></span>
      <span class="seg only3d" id="segView"><button type="button" data-v="front" data-t="vFront"></button><button type="button" data-v="side" data-t="vSide"></button><button type="button" data-v="top" data-t="vTop"></button><button type="button" data-v="iso">3D</button></span>
      <div class="row">
        <button type="button" class="btn" id="btnUndo" data-t="undo"></button>
        <button type="button" class="btn" id="btnRedo" data-t="redo"></button>
        <button type="button" class="btn solid" id="btnAuto" data-t="auto"></button>
        <button type="button" class="btn" id="btnPng" data-t="exportPng"></button>
      </div>
    </div>
    <div class="bar only3d">
      <div class="row"><span class="lab" data-t="shell"></span><span class="seg" id="segShell"><button type="button" data-v="glass" data-t="mGlass"></button><button type="button" data-v="cut" data-t="mCut"></button><button type="button" data-v="solid" data-t="mSolid"></button><button type="button" data-v="off" data-t="mOff"></button></span></div>
      <div class="row"><span class="lab" data-t="parts"></span><span class="seg" id="segMode"><button type="button" data-v="detail" data-t="mDetail"></button><button type="button" data-v="block" data-t="mBlock"></button></span></div>
      <div class="row">
        <button type="button" class="btn small" id="togLabels" aria-pressed="false" data-t="labels"></button>
        <button type="button" class="btn small" id="togGrid" aria-pressed="true" data-t="grid"></button>
        <button type="button" class="btn small" id="togMagnet" aria-pressed="true" data-t="magnet"></button>
        <button type="button" class="btn small" id="togLinks" aria-pressed="true" data-t="linksTog"></button>
      </div>
    </div>
    <div class="viewport" id="viewport">
      <canvas id="gl"></canvas>
      <div class="tags" id="tags"></div>
      <div class="axes" dir="ltr">X · Y↑ · Z · mm</div>
      <div class="chipname" id="chipName"></div>
      <div class="hint" data-t="hint"></div>
    </div>
    <div class="mapview" id="mapView" hidden>
      <div class="bar"><span class="seg" id="segMapKind"><button type="button" data-v="all" data-t="mapAll"></button><button type="button" data-v="data" data-t="k_data"></button><button type="button" data-v="power" data-t="k_power"></button><button type="button" data-v="water" data-t="k_water"></button><button type="button" data-v="other" data-t="k_other"></button></span></div>
      <p class="fine" data-t="mapIntro"></p>
      <div id="mapBody"></div>
      <section class="msys mform">
        <h3 data-t="mapAdd"></h3>
        <div class="mrow">
          <label class="f"><span data-t="mapFrom"></span><select id="mfFrom"></select></label>
          <label class="f"><span data-t="mapTo"></span><select id="mfTo"></select></label>
          <label class="f"><span data-t="kind"></span><select id="mfKind"></select></label>
          <label class="f"><span data-t="mapMax"></span><input type="number" id="mfMax" value="300" min="0" step="10"></label>
          <button type="button" class="btn solid" id="mfAdd" data-t="mapAdd"></button>
        </div>
      </section>
    </div>
  </main>

  <aside class="col">
    <section class="card">
      <span class="lab" data-t="cogTitle"></span>
      <div class="big"><span id="cogNum" dir="ltr">—</span><small>mm</small></div>
      <p class="fine" id="cogSub"></p>
      <p id="balTxt" style="margin:0;font-size:13px"></p>
      <div class="row" id="fillRow" hidden><span class="lab" data-t="fill"></span><span class="seg" id="segFill"><button type="button" data-v="full" data-t="full"></button><button type="button" data-v="empty" data-t="empty"></button></span></div>
      <p class="fine" id="fillTxt"></p>
    </section>
    <section class="stats">
      <div class="stat"><span class="lab" data-t="mass"></span><b id="massNum">0</b></div>
      <div class="stat"><span class="lab" data-t="placed"></span><b id="partsNum">0</b></div>
      <div class="stat" id="stCol"><span class="lab" data-t="collisions"></span><b id="colNum">0</b></div>
      <div class="stat" id="stOut"><span class="lab" data-t="outside"></span><b id="outNum">0</b></div>
    </section>
    <section class="card">

he:[
 ['סדר עבודה מומלץ','ol',['פתח פרויקט חדש ותן לו שם.','מלא את טבלת הרכיבים: הקלדה ישירה, ייבוא Excel/CSV, או הדבקה מ-Google Sheets.','העלה מעטפת חיצונית ומודלים של רכיבים, אם יש.','הגדר נקודת ייחוס לאיזון וסטייה מותרת.','שייך כללים לרכיבים מתוך בנק הכללים.','גרור רכיבים למקומם או לחץ "סידור אוטומטי", ותקן לפי לוח הבדיקות.','שמור כל חלופה כקונפיגורציה, וייצא גיליון PNG למצגת.']],
 ['קבצים נתמכים','ul',['תלת-ממד: STL, OBJ, STEP (‎.step / .stp).','X_T (Parasolid) לא נתמך. ייצא מתוכנת ה-CAD ל-STEP או STL.','טבלה: ‎.xlsx, .xls, .csv, .tsv, או הדבקה ישירה מגיליון.','קובץ פרויקט: ‎.json שנשמר מהאתר הזה בלבד.','אפשר לגרור כמה קבצים יחד לכל מקום בדף.']],
 ['טבלת רכיבים','ul',['מידות במ"מ, מסה בק"ג. X = אורך, Y = גובה, Z = רוחב.','שורת הכותרות בקובץ חייבת להתאים לתבנית. הורד אותה מ"הורד תבנית Excel".','"כמות" יוצרת כמה יחידות זהות של אותו רכיב.','"מסה ריק" מיועדת לרכיב שהמסה שלו משתנה, כמו מיכל.','"מקור הנתון": כתוב אם המספר מדוד, מדף יצרן או הערכה. הכלי לא יודע להבחין, והתוצאות טובות רק כמו הנתונים.','שינוי מזהה של רכיב מנתק כללים של רכיבים אחרים שכיוונו אליו. בדוק אותם אחרי שינוי.']],
 ['קבצי תלת-ממד','ul',['לכל קובץ בוחרים אם הוא מעטפת או מודל של רכיב. ההתאמה לרכיב מנוחשת משם הקובץ, אז כדאי לתת לקובץ את שם הרכיב.','בדוק יחידות וציר עליון. אם המודל ענק, זעיר או שוכב על הצד, תקן בהגדרות המעטפת.','מודל של רכיב מחליף את המידות שלו בטבלה במידות התיבה החוסמת של הקובץ.','סוג המודל: "חלול" למעטפת עם דפנות ועובי, "מלא" לגוף אטום. הכלי מנחש, ואם בדיקת "מחוץ למעטפת" נראית שגויה, החלף את הסוג.','STEP נטען לאט יותר (עד כחצי דקה בפעם הראשונה).']],
 ['נקודות על המודל','ul',['"סמן נקודה" ואז לחיצה על המודל יוצרת נקודה שאפשר לכוון אליה כללים.','נקודה שייכת למעטפת שעליה סומנה. שינוי יחידות, סיבוב או גובה של המעטפת לא מזיז אותה, וצריך לסמן מחדש.']],
 ['נקודת ייחוס ואיזון','ul',['מרכז הכובד נמדד כמרחק אופקי מנקודת הייחוס: ציר גלגלים, מרכז רוטורים, מרכז בסיס וכדומה.','אפשר להזין X ו-Z ידנית, או לתת לרכיב את הכלל "מגדיר נקודת ייחוס" ואז הנקודה נלקחת ממיקומו.','הסטייה המותרת היא החלטה שלך. הכלי לא יודע מה נכון למוצר שלך.','המתג "מלא / ריק" מראה כמה מרכז הכובד זז כשהמסה המשתנה מתרוקנת.']],
 ['בנק הכללים','ul',['כלל הוא דרישת מיקום לרכיב. חלק נבדקים אוטומטית וחלק מסומנים "לבדיקה ידנית".','כללי "קרוב ל" ו"רחוק מ" צריכים יעד: רכיב, נקודה או קטגוריה. בלי יעד הכלל לא נבדק.','אפשר להוסיף כלל משלך ולבחור איך הוא ייבדק.','בטבלה כותבים כללים כקוד, למשל ‎low; far:battery:30‎. רשימת הקודים בגיליון השני של התבנית.','כללים יכולים לסתור זה את זה. הפרה בלוח הבדיקות היא מידע לשיקול דעת, לא בהכרח טעות.']],
 ['חיבורים','ul',['הכלל link מחבר רכיב לרכיב אחר, לקטגוריה או לנקודה על המודל. בטבלה: link:<יעד>:<אורך מרבי>:<סוג>, למשל link:gnss_hrtk_f9p:300:data.','סוג: data (כחול), power (כתום), water (טורקיז). בלי סוג, החיבור נחשב data.','שרשרת נבנית מכמה כללים: מחשב → GPS בשורה של המחשב, GPS → רכיב אחר בשורה של ה-GPS.','האורך הוא קו ישר בין מרכזי הרכיבים. כבל אמיתי עובר מסביב לרכיבים ויוצא ממחבר, אז תן מרווח באורך המרבי.','קו מקווקו אדום = ארוך מהמותר. בחירת רכיב מדגישה את החיבורים שלו ומציגה את האורך שלהם.','אם ליעד יש כמה יחידות (למשל 6 מנועים), החיבור הולך ליחידה הקרובה ביותר.']],
 ['מפת חיבורים','ul',['הכפתור "מפת חיבורים" למעלה פותח עמוד שמראה מה מתחבר למה ובאיזה סדר. אפשר לשמור קישור ישיר אליו (‎#map בסוף הכתובת).','כל סוג חיבור הוא מערכת נפרדת עם עץ משלה. העץ מתחיל ברכיב עם הכי הרבה חיבורים, ואפשר לבחור רכיב התחלה אחר.','לחיצה על רכיב בוחרת אותו. ✕ מוחק חיבור, והטופס בתחתית מוסיף חיבור חדש.']],
 ['הזזה ותצוגה','ul',['גרירת רכיב מזיזה אותו במישור המבט. Shift+גרירה מזיזה למעלה ולמטה.','R מסובב 90° סביב הציר האנכי, Shift+R סביב X. Del מחזיר לרשימה. Ctrl+Z מבטל.','"מגנט" מצמיד לדפנות ולרכיבים שכנים. Alt בזמן גרירה מבטל אותו זמנית.','"נעל" מקבע רכיב, והסידור האוטומטי לא יזיז אותו.','אדום = התנגשות, כתום = מחוץ למעטפת, כחול = הפרת כלל.']],
 ['סידור אוטומטי','ul',['מציב כל רכיב שאינו נעול לפי הכללים שלו, ושומר על מרכז הכובד קרוב לנקודת הייחוס.','זו הצעת פתיחה ולא פתרון מיטבי. הוא מחפש ברשת של מיקומים ולא בודק כל אפשרות.','הוא מבטל את הסידור הנוכחי של רכיבים לא נעולים. Ctrl+Z מחזיר.','רכיב שמגדיר נקודת ייחוס לא מוזז. הצב אותו ידנית קודם.']],
 ['קירובים שכדאי להכיר','ul',['התנגשות נבדקת לפי התיבה החוסמת של הרכיב (לגליל יש בדיקה עגולה), לא לפי הצורה המדויקת.','המסה של כל רכיב מחושבת כאילו היא במרכז התיבה שלו.','כבלים, צנרת, ברגים ומשקל המעטפת עצמה לא נכללים, אלא אם תוסיף אותם כרכיבים.','הספים של "נמוך" ו"גבוה" הם שליש תחתון ושליש עליון. זו בחירה של הכלי ולא תקן.','הכלי לא בודק חום, חוזק, אטימות או חיווט. הוא עוזר לבחון סידור, ולא מחליף בדיקה הנדסית.']],
 ['שמירה וגיבוי','ul',['השינויים נשמרים אוטומטית. שורת המצב בכרטיס הפרויקט אומרת איפה.','"שמור קובץ פרויקט" יוצר קובץ אחד עם הכול, כולל המודלים. השתמש בו לגיבוי ולמעבר בין מחשבים.','ניקוי נתוני הגלישה בדפדפן מוחק פרויקטים שנשמרו רק בו. גבה לפני כן.','"קונפיגורציות שמורות" הן חלופות סידור בתוך אותו פרויקט. שמירה באותו שם מחליפה את הקודמת.']]

en:[
 ['Suggested workflow','ol',['Start a new project and name it.','Fill the parts table: type it in, import Excel/CSV, or paste from Google Sheets.','Add an outer shell and part models, if you have them.','Set the balance reference point and the allowed offset.','Assign rules to parts from the rule bank.','Drag parts into place or press "Auto-arrange", then fix what the checks panel reports.','Save each alternative as a configuration and export a PNG sheet for your deck.']],
 ['Supported files','ul',['3D: STL, OBJ, STEP (.step / .stp).','X_T (Parasolid) is not supported. Export to STEP or STL from your CAD program.','Table: .xlsx, .xls, .csv, .tsv, or a direct paste from a sheet.','Project file: a .json saved from this site only.','You can drop several files at once anywhere on the page.']],
 ['Parts table','ul',['Sizes in mm, mass in kg. X = length, Y = height, Z = width.','The header row of your file must match the template. Get it from "Download Excel template".','"Qty" creates several identical units of one part.','"Empty mass" is for a part whose mass changes, such as a tank.','"Source": note whether a number is measured, from a datasheet, or an estimate. The tool cannot tell, and results are only as good as the data.','Changing a part ID breaks rules on other parts that targeted it. Check them afterwards.']],
 ['3D files','ul',['For each file choose shell or part model. The part match is guessed from the file name, so name the file after the part.','Check units and up axis. If the model is huge, tiny or lying on its side, fix it in the shell settings.','A part model replaces that part\'s table size with the bounding box of the file.','Model type: "Hollow" for a shell with wall thickness, "Solid" for a closed body. The tool guesses; if "outside shell" looks wrong, switch the type.','STEP loads more slowly (up to about half a minute the first time).']],
 ['Points on the model','ul',['"Mark a point", then a click on the model, creates a point that rules can target.','A point belongs to the shell it was marked on. Changing that shell\'s units, turn or height does not move it; mark it again.']],
 ['Reference point and balance','ul',['The centre of gravity is measured as a horizontal distance from the reference point: wheel axle, rotor centre, base centre and so on.','Type X and Z by hand, or give a part the rule "Defines the reference point" and the point follows that part.','The allowed offset is your decision. The tool does not know what is right for your product.','The "Full / Empty" switch shows how far the centre of gravity moves as the variable mass empties.']],
 ['Rule bank','ul',['A rule is a placement demand on a part. Some are checked automatically, others are marked "check by hand".','"Close to" and "Away from" rules need a target: a part, a point or a category. Without one the rule is not checked.','You can add your own rule and choose how it is checked.','In the table, rules are written as codes, e.g. low; far:battery:30. The codes are listed on the second sheet of the template.','Rules can contradict each other. A violation in the checks panel is information for your judgement, not always a mistake.']],
 ['Connections','ul',['The link rule connects a part to another part, a category or a point on the model. In the table: link:<target>:<max length>:<type>, e.g. link:gnss_hrtk_f9p:300:data.','Type: data (blue), power (orange), water (teal). Without a type the link counts as data.','A chain is built from several rules: computer → GPS in the computer row, GPS → another part in the GPS row.','Length is the straight line between part centres. A real cable leaves from a connector and runs around parts, so leave margin in the maximum.','Dashed red line = longer than allowed. Selecting a part highlights its connections and shows their lengths.','If the target has several units (for example 6 motors), the link goes to the nearest one.']],
 ['Connection map','ul',['The "Connection map" button at the top opens a page that shows what connects to what and in which order. You can bookmark it (#map at the end of the address).','Each connection type is its own system with its own tree. The tree starts at the part with the most links; you can pick another start.','Clicking a part selects it. ✕ deletes a connection, and the form at the bottom adds one.']],
 ['Moving and viewing','ul',['Dragging moves a part in the view plane. Shift-drag moves it up and down.','R turns 90° about the vertical axis, Shift+R about X. Del sends it back to the list. Ctrl+Z undoes.','"Magnet" snaps to walls and neighbouring parts. Hold Alt while dragging to switch it off.','"Lock" pins a part, and auto-arrange will not move it.','Red = collision, orange = outside the shell, blue = rule violation.']],
 ['Auto-arrange','ul',['Places every unlocked part by its rules and keeps the centre of gravity near the reference point.','It is a starting proposal, not an optimum. It searches a grid of positions and does not try everything.','It discards the current positions of unlocked parts. Ctrl+Z brings them back.','A part that defines the reference point is not moved. Place it by hand first.']],
 ['Approximations to know','ul',['Collisions use each part\'s bounding box (cylinders get a round check), not the exact shape.','Each part\'s mass is treated as sitting at the centre of its box.','Cables, piping, fasteners and the weight of the shell itself are not included unless you add them as parts.','The "low" and "high" thresholds are the bottom and top third. That is the tool\'s choice, not a standard.','The tool does not check heat, strength, sealing or wiring. It helps you study a layout and does not replace engineering review.']],
 ['Saving and backup','ul',['Changes are saved automatically. The status line in the project card says where.','"Save project file" writes one file with everything, models included. Use it for backup and to move between computers.','Clearing browsing data deletes projects that were saved only in the browser. Back up first.','"Saved configurations" are layout alternatives inside one project. Saving under the same name replaces the earlier one.']]
]};
function renderHelp(){var box=$('#helpBody');box.textContent='';HELP[lang].forEach(function(sec){box.appendChild(el('h3','',sec[0]));var l=el(sec[1]);sec[2].forEach(function(x){l.appendChild(el('li','',x));});box.appendChild(l);});}

/* ================= wiring ================= */
function bind(){
  $('#segLang').onclick=function(e){var v=e.target.dataset.v;if(!v)return;lang=v;applyLang();renderProjects();renderShells();refreshUI();storageNote();if(!$('#tableModal').hidden)renderGrid();if(!$('#drawer').hidden)renderDrawer();if(!$('#helpModal').hidden)renderHelp();persist();};
  $('#selProject').onchange=function(){persist();openProject($('#selProject').value);};
  $('#projName').onchange=function(){P.name=$('#projName').value.trim()||P.name;P.example=false;renderProjects();touch();};
  ['refLabel','refX','refZ','tol'].forEach(function(id){$('#'+id).onchange=function(){P.ref.label=$('#refLabel').value;P.ref.x=num($('#refX').value,0);P.ref.z=num($('#refZ').value,0);P.tol=Math.max(0,num($('#tol').value,10));runChecks();refreshUI();requestRender();touch();};});
  $('#btnNewProj').onclick=function(){persist();var p=freshProject(t('project')+' '+(projects.length+1));projects.push(p);openProject(p.id);touch();$('#projName').focus();$('#projName').select();};
  $('#btnDelProj').onclick=function(){confirmBox(t('qDelProj',P.name),function(){var id=P.id;projects=projects.filter(function(p){return p.id!==id;});kvDel('proj:'+id);if(remote.col)remote.col.doc('proj_'+id).delete().catch(function(){});
    if(!projects.length)projects.push(exampleProject());openProject(projects[0].id);persist();});};
  $('#btnExportProj').onclick=function(){saveFile(safeName(P.name)+'.json',projectFile(),false).then(function(){toast(t('tSaved'));});};
  $('#btnImportProj').onclick=function(){$('#projFile').click();};$('#projFile').onchange=function(e){if(e.target.files[0])importProjectFile(e.target.files[0]);e.target.value='';};
  var drop=$('#drop');drop.onclick=function(){$('#cadFile').click();};drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#cadFile').click();}};
  $('#cadFile').onchange=function(e){addCadFiles(e.target.files);e.target.value='';};
  ['dragenter','dragover'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over');});});
  window.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length){var fs=e.dataTransfer.files,f0=fs[0].name;
    if(/\.(xlsx|xls|csv|tsv)$/i.test(f0))importTable(fs[0]);else if(/\.json$/i.test(f0))importProjectFile(fs[0]);else addCadFiles(fs);}});
  $('#btnFileGo').onclick=commitFiles;$('#btnFileCancel').onclick=function(){pending=[];$('#fileModal').hidden=true;};
  ['shName','shUnit','shUp','shTurn','shUnder','shKind'].forEach(function(id){$('#'+id).onchange=function(){var S=curShell();if(!S)return;S.name=$('#shName').value||S.name;S.unit=$('#shUnit').value;S.up=$('#shUp').value;S.turn=$('#shTurn').value;S.under=num($('#shUnder').value,0);S.kind=$('#shKind').value;
    rebuildShell();syncAll();refreshUI();renderShells();setView(ui.view);touch();};});
  $('#btnShDel').onclick=function(){var S=curShell();if(!S)return;P.shells=P.shells.filter(function(x){return x!==S;});kvDel('geo:'+S.id);delete geo[S.id];P.work.shellId=P.shells[0]?P.shells[0].id:null;rebuildShell();syncAll();commit();renderShells();};
  $('#btnTable').onclick=function(){renderGrid();$('#tableModal').hidden=false;};$('#btnTableDone').onclick=function(){$('#tableModal').hidden=true;};
  $('#btnAddRow').onclick=function(){P.parts.push(newPart({name:t('parts')+' '+(P.parts.length+1)}));partsChanged();renderGrid();};
  $('#btnTpl').onclick=function(){saveFile('config-studio-template.xlsx',templateBlob(),false);};
  $('#btnImportTable').onclick=function(){$('#tableFile').click();};$('#tableFile').onchange=function(e){if(e.target.files[0])importTable(e.target.files[0]);e.target.value='';};
  $('#btnPaste').onclick=function(){$('#pasteBox').hidden=!$('#pasteBox').hidden;};
  $('#btnPasteGo').onclick=function(){var rows=$('#pasteArea').value.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){return l.split(l.indexOf('\t')>=0?'\t':',');});addRows(rowsToParts(rows),$('#pasteReplace').checked);$('#pasteArea').value='';};
  $('#btnExample').onclick=function(){persist();var ex=projects.filter(function(p){return p.example;})[0];if(!ex){ex=exampleProject();projects.push(ex);}openProject(ex.id);if(!ex.configs.length&&onList().length<=2)autoArrangeQuiet();persist();};
  $('#btnHelp').onclick=function(){renderHelp();$('#helpModal').hidden=false;};$('#helpClose').onclick=function(){$('#helpModal').hidden=true;};
  $('#btnPoint').onclick=function(){setPick(!pickMode);};
  $('#btnBank').onclick=function(){openDrawer(null);};$('#drawerClose').onclick=function(){$('#drawer').hidden=true;};
  $('#nrAdd').onclick=function(){var n=$('#nrName').value.trim();if(!n)return;var base=$('#nrBase').value,id=slug(n).slice(0,14)||uid('r');while(ruleDef(id))id+='x';
    var d={id:id,base:base,custom:true,n:[n,n],d:[$('#nrDesc').value.trim(),$('#nrDesc').value.trim()]};if(base==='near'||base==='far'||base==='link')d.tg=1;if(['near','far','center','wall','clear','link'].indexOf(base)>=0)d.ds=num($('#nrDist').value,20);
    P.customRules.push(d);$('#nrName').value='';$('#nrDesc').value='';rulesChanged();};
  $('#segView').onclick=function(e){if(e.target.dataset.v)setView(e.target.dataset.v);};
  $('#segShell').onclick=function(e){if(e.target.dataset.v){ui.shell=e.target.dataset.v;applyShellMode();refreshUI();}};
  $('#segMode').onclick=function(e){if(e.target.dataset.v){ui.mode=e.target.dataset.v;syncAll();refreshUI();}};
  $('#segFill').onclick=function(e){if(e.target.dataset.v){fill=e.target.dataset.v;runChecks();refreshUI();requestRender();}};
  $('#togLabels').onclick=function(){ui.labels=!ui.labels;refreshUI();requestRender();};$('#togGrid').onclick=function(){ui.grid=!ui.grid;refreshUI();};$('#togMagnet').onclick=function(){ui.magnet=!ui.magnet;refreshUI();};document.querySelectorAll('#segPage button').forEach(function(b){b.onclick=function(){showPage(b.dataset.v);};});document.querySelectorAll('#segMapKind button').forEach(function(b){b.onclick=function(){mapKind=b.dataset.v;renderMap();};});$('#mfAdd').onclick=addMapLink;window.addEventListener('hashchange',function(){showPage(location.hash==='#map'?'map':'3d');});
  $('#togLinks').onclick=function(){ui.links=!ui.links;runChecks();refreshUI();requestRender();};
  $('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnAuto').onclick=autoArrange;$('#btnPng').onclick=exportPng;
  $('#btnSave').onclick=function(){var n=$('#cfgName').value.trim()||P.work.name;P.work.name=n;var ex=P.configs.filter(function(c){return c.name===n;})[0],st=clone(P.work);
    if(ex){ex.state=st;ex.summary=summary();ex.updatedAt=Date.now();}else P.configs.push({id:uid('c'),name:n,state:st,summary:summary(),updatedAt:Date.now()});touch();refreshUI();toast(t('tSaved'));};
  $('#btnEmpty').onclick=function(){Object.keys(P.work.items).forEach(function(k){var it=P.work.items[k];it.on=false;it.lock=false;it.why=null;});P.work.name=t('cfg')+' '+(P.configs.length+1);selected=null;syncAll();commit();};
  $('#imgClose').onclick=function(){$('#imgModal').hidden=true;};
  window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(vp);
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);
  new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
function start(){
  loadLocal().then(function(cur){
    applyLang();if(!projects.length)projects.push(exampleProject());
    bind();readTheme();resize();openProject(cur||projects[0].id);
    if(P.example&&!P.configs.length&&onList().length<=2){autoArrangeQuiet();}
    showPage(location.hash==='#map'?'map':'3d');storageNote();loop();initRemote();
  });
}
function autoArrangeQuiet(){var tt=toast;toast=function(){};try{autoArrange();}finally{toast=tt;}hist=[JSON.stringify(P.work)];histIdx=0;refreshUI();}
window.__studio={get P(){return P;},get checks(){return checks;},select:select,syncAll:syncAll,autoArrange:autoArrange,rowsToParts:rowsToParts,pointState:pointState};
start();
})();

</script>
